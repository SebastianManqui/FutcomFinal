spring.application.name=futcom
server.port=${PORT:8080}

# Conexion a MySQL (variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-Meteo API
openmeteo.base-url=${OPENMETEO_BASE_URL}

# Spring Security - JWT
#jwt.secret=${JWT_SECRET}
# JwtUtil lee JWT_SECRET directamente desde la variable de entorno

# Evita conflicto entre Springdoc y HATEOAS
springdoc.enable-hateoas=false