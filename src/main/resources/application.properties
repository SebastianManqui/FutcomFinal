spring.application.name=futcom
# Conexion a MySQL local 
spring.datasource.url=jdbc:mysql://localhost:3307/futcom_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-Meteo API (clima, sin API key)
openmeteo.base-url=https://api.open-meteo.com


# IMPORTANTE: cambia este valor en produccion por uno aleatorio largo (min 32 caracteres)
# Spring Security - JWT para Futcom
jwt.secret=futcom-app-clave-secreta-jwt-2026-seguridad-desarrollo-local-987654321

